#
# The handbook's translations, a paragraph at a time: po/update.sh runs
# po4a with this file. Add a language to po4a_langs.
[options] --master-charset UTF-8 --localized-charset UTF-8 --keep 80 --package-name plasma-label-creator --copyright-holder nvaert1986 --msgid-bugs-address https://github.com/nvaert1986/plasma-label-creator/issues
[po4a_langs] nl
[po4a_paths] doc/po/handbook.pot $lang:doc/po/$lang.po
[type: docbook] doc/index.docbook $lang:po/$lang/docs/plasma-label-creator/index.docbook
